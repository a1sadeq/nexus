<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Canvas: pure black, rounded -->
  <rect width="512" height="512" rx="64" fill="#0a0a0a"/>

  <!-- Connection lines: hub-spoke, hair-thin white -->
  <g stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.15">
    <line x1="256" y1="256" x2="170" y2="160"/>
    <line x1="256" y1="256" x2="375" y2="260"/>
    <line x1="256" y1="256" x2="310" y2="390"/>
    <line x1="256" y1="256" x2="395" y2="130"/>
    <line x1="256" y1="256" x2="130" y2="355"/>
    <line x1="256" y1="256" x2="250" y2="95"/>
  </g>

  <!-- Hub dot: center convergence point -->
  <circle cx="256" cy="256" r="3" fill="#ffffff" opacity="0.9"/>

  <!-- Gemini: 4-point sparkle (1.3x, 100%, closest) at (170,160) -->
  <path d="M170 134 C171.5 150 177 156 183 160 C177 164 171.5 170 170 186 C168.5 170 163 164 157 160 C163 156 168.5 150 170 134 Z" fill="#ffffff" opacity="1.0"/>

  <!-- Claude: 6-ray asterisk (1.2x, 95%) at (375,260) -->
  <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.95">
    <line x1="375" y1="236" x2="375" y2="284"/>
    <line x1="354.2" y1="248" x2="395.8" y2="272"/>
    <line x1="354.2" y1="272" x2="395.8" y2="248"/>
  </g>

  <!-- DeepSeek: whale silhouette (1.1x, 85%) at (310,390) -->
  <path d="M290 390 C293 383 305 380 315 383 C320 385 325 388 328 390 L332 385 L329 390 L333 394 L328 392 C324 396 310 398 300 396 C292 394 288 392 290 390 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Qwen: Q-ring with tail (1.0x, 75%) at (395,130) -->
  <g opacity="0.75">
    <circle cx="395" cy="126" r="12" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="403" y1="134" x2="409" y2="140" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Kimi: crescent moon (0.95x, 70%) at (130,355) -->
  <path d="M130 342 A13 13 0 1 0 130 368 A9.5 9.5 0 1 1 130 342 Z" fill="#ffffff" opacity="0.70"/>

  <!-- Perplexity: loop with tail (0.9x, 65%) at (250,95) -->
  <path d="M250 85 A10 10 0 1 1 242 103 L238 108" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
</svg>
