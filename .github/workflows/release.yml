name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ github.token }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: warn

  build-linux:
    name: Build Linux (.pacman)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools bsdtar zstd fakeroot

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Linux pacman
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux
          path: |
            dist/*.pacman
            dist/latest-linux.yml
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          TAG="${{ steps.release_tag.outputs.tag }}"
          find . -maxdepth 1 -type f \( -name "*.exe" -o -name "*.pacman" -o -name "*.blockmap" -o -name "*.yml" \) -exec sha256sum {} + > "SHA256SUMS-${TAG}.txt" || true
          cat "SHA256SUMS-${TAG}.txt" || true

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          echo "Publishing release $TAG with assets:"
          ls -la release-assets/
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Nexus $TAG" --generate-notes release-assets/*
          else
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --draft=false --latest
          fi
