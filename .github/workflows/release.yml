name: Release

# Builds the installers and publishes the update feed that every installed copy of Nexus polls.
#
# The app updates itself through electron-updater, which reads `latest.yml` (Windows) and `latest-linux.yml`
# from the newest GitHub release. So publishing a release is not just a download page: the feed files *are*
# the update. They are uploaded next to the installers, and an install that is running 1.1.3 will find
# 1.1.4 on its next check (8 s after launch, then every 15 minutes).
#
# Push a tag that matches `package.json` and this does the rest:
#   git tag -a v1.1.4 -m "Nexus 1.1.4" && git push origin main v1.1.4

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, test, and verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with `package.json` produces installers named 1.1.3 inside a v1.1.4 release,
      # and electron-updater then refuses the update on every machine that already has it. Cheaper to stop
      # here than to work that out from a user's diagnostics export.
      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            echo "Not a tag build; skipping the version check."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG version=$VERSION"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build-windows:
    name: Build Windows (.exe)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in refs/*) TAG="v$(node -p "require('./package.json').version")";; esac
          echo "releasing $TAG"
          NOTES=".github/release-notes/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$(mktemp)"
            printf 'Automated build for %s\n' "$TAG" > "$NOTES"
          fi
          exists=$(gh release view "$TAG" --json id --jq '.id' 2>/dev/null || echo "")
          if [ -z "$exists" ]; then
            gh release create "$TAG" \
              --title "Nexus ${TAG#v}" \
              --notes-file "$NOTES" \
              --draft=false \
              --latest \
              dist/*.exe \
              dist/*.exe.blockmap \
              dist/latest.yml
          else
            gh release edit "$TAG" --title "Nexus ${TAG#v}" --notes-file "$NOTES" --draft=false --latest
            gh release upload "$TAG" \
              dist/*.exe \
              dist/*.exe.blockmap \
              dist/latest.yml --clobber
          fi

  build-linux:
    name: Build Linux (.pacman + .AppImage)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd fakeroot rpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # AppImage is the one Linux target electron-updater can update in place, and `latest-linux.yml` is
      # what it reads to find it — pacman alone would leave Linux users on whatever they installed.
      - name: Build Linux packages
        run: |
          npm run build
          npx electron-builder --linux pacman AppImage --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux
          path: |
            dist/*.pacman
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

      - name: Create or update GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in refs/*) TAG="v$(node -p "require('./package.json').version")";; esac
          echo "releasing $TAG"
          exists=$(gh release view "$TAG" --json id --jq '.id' 2>/dev/null || echo "")
          if [ -z "$exists" ]; then
            gh release create "$TAG" \
              --title "Nexus ${TAG#v}" \
              --notes "Automated build for $TAG" \
              --draft=false \
              --latest \
              dist/*.pacman \
              dist/*.AppImage \
              dist/latest-linux.yml
          else
            gh release edit "$TAG" --draft=false --latest
            gh release upload "$TAG" \
              dist/*.pacman \
              dist/*.AppImage \
              dist/latest-linux.yml --clobber
          fi

  verify-feed:
    name: Verify the update feed
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The release existing is not the same as the release being updatable: without `latest.yml` pointing
      # at an asset that is actually attached, every installed copy quietly stays on the old version.
      - name: Check the published assets and version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in refs/*) TAG="v$(node -p "require('./package.json').version")";; esac
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking $TAG (version $VERSION)"
          gh release view "$TAG" --json assets,isDraft,isLatest \
            --jq '.assets[].name' | tee assets.txt
          for want in latest.yml latest-linux.yml; do
            grep -qx "$want" assets.txt || { echo "::error::missing $want — auto-update will not see this release"; exit 1; }
          done
          grep -q "nexus-${VERSION}-setup.exe" assets.txt || { echo "::error::missing the Windows installer"; exit 1; }
          gh release view "$TAG" --json isDraft,isLatest --jq '"draft=\(.isDraft) latest=\(.isLatest)"'
