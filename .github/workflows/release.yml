name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build-windows:
    name: Build Windows (.exe)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: warn

      - name: Create or update GitHub Release
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          exists=$(gh release view "$TAG" --json id --jq '.id' 2>/dev/null || echo "")
          if [ -z "$exists" ]; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "Automated build for $TAG" \
              --draft=false \
              --latest \
              dist/*.exe \
              dist/*.exe.blockmap \
              dist/latest.yml
          else
            gh release edit "$TAG" --draft=false --latest
            gh release upload "$TAG" \
              dist/*.exe \
              dist/*.exe.blockmap \
              dist/latest.yml --clobber
          fi

  build-linux:
    name: Build Linux (.pacman)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        
      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd fakeroot

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Linux pacman
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux
          path: |
            dist/*.pacman
            dist/latest-linux.yml
          if-no-files-found: warn

      - name: Create or update GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          exists=$(gh release view "$TAG" --json id --jq '.id' 2>/dev/null || echo "")
          if [ -z "$exists" ]; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "Automated build for $TAG" \
              --draft=false \
              --latest \
              dist/*.pacman \
              dist/latest-linux.yml
          else
            gh release edit "$TAG" --draft=false --latest
            gh release upload "$TAG" \
              dist/*.pacman \
              dist/latest-linux.yml --clobber
          fi
