name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Typecheck and tests both read the sources one file at a time; only a real bundle proves the app
      # builds. This is the same esbuild/rollup pass the release runs, so a broken import fails here
      # instead of failing a release build twenty minutes in.
      - name: Bundle (main, preload, renderer)
        run: npx electron-vite build
